"$schema" = 'https://starship.rs/config-schema.json'

# Hybrid Palette: Kanagawa colors that mimic the Gruvbox warmth
palette = "kanagawa_gruv"

[palettes.kanagawa_gruv]
bg_dim = "#1F1F28"       # Sumi Ink (Background)
paper = "#DCD7BA"        # Fuji White (The "Cream" text)
faded_green = "#76946A"  # Spring Green (Muted forest)
sand_gold = "#DCA561"    # Autumn Yellow (The Gruvbox Yellow/Orange)
clay_red = "#C34043"     # Autumn Red (Muted, earthy red)
wood_grey = "#727169"    # Old White (Warm brownish grey)

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$cmd_duration\
$line_break\
$python\
$character"""

[directory]
# Gruvbox style: Use a warm green or the paper white for the path
style = "bold faded_green" 

[character]
# The iconic Gruvbox gold/yellow
success_symbol = "[❯](bold sand_gold)" 
error_symbol = "[❯](bold clay_red)"
vimcmd_symbol = "[❮](wood_grey)"

[git_branch]
format = "[$branch]($style)"
style = "bold sand_gold"

[git_status]
# Red for the "!" symbols, grey for the rest
format = "[[(*$conflicted$untracked$modified$staged$renamed$deleted)](clay_red) ($ahead_behind$stashed)]($style)"
style = "wood_grey"
conflicted = "​"
untracked = "​"
modified = "​"
staged = "​"
renamed = "​"
deleted = "​"
stashed = "≡"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "wood_grey"

[cmd_duration]
format = "[$duration]($style) "
style = "wood_grey"

[python]
format = "[$virtualenv]($style) "
style = "wood_grey"
detect_extensions = []
detect_files = []
